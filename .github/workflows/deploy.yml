name: Deploy zu Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Hochgeladen wird nur der Ordner public/ (die eigentliche Website)
      - uses: actions/checkout@v4

      # Meldungen und Crowdfunding-Zahlen aus content/ (Pages CMS) nach public/data/ schreiben
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Inhalte aufbereiten
        run: node scripts/build-content.mjs

      # Große Handyfotos aus dem CMS verkleinern (nur in der hochgeladenen Kopie, das Repo bleibt unverändert)
      - name: Bilder für Meldungen verkleinern
        run: |
          shopt -s nullglob nocaseglob
          files=(public/img/news/*.jpg public/img/news/*.jpeg public/img/news/*.png public/img/news/*.webp)
          [ ${#files[@]} -eq 0 ] && exit 0
          command -v mogrify >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick; }
          mogrify -auto-orient -strip -resize '1800x1800>' -quality 82 "${files[@]}"
          ls -la public/img/news

      - name: Auf Cloudflare Pages veröffentlichen
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: a85652029c4e35a2fc75172ec88c3b9d
          command: pages deploy public --project-name=ffd-production-website --branch=main --commit-dirty=true
