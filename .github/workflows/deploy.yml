name: Deploy zu Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Immer nur ein Deploy gleichzeitig; ein neuer Push bricht den laufenden ab.
# Sonst kann ein älterer Stand, der zuletzt fertig wird, einen neueren überschreiben
# (passiert, wenn Pages CMS Bild und Meldung als zwei schnelle Commits speichert).
concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Hochgeladen wird nur der Ordner public/ (die eigentliche Website)
      - uses: actions/checkout@v4

      # Meldungen und Crowdfunding-Zahlen aus content/ (Pages CMS) nach public/data/ schreiben
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Bilder aus dem CMS webtauglich machen (nur in der hochgeladenen Kopie, das Repo bleibt unverändert):
      # PNG/WebP → zusätzlich bild.png.jpg (build-content.mjs zeigt dann darauf), alles auf max. 1800 px, JPG-Qualität 82
      - name: Bilder für Meldungen verkleinern
        run: |
          shopt -s nullglob nocaseglob
          files=(public/img/news/*.jpg public/img/news/*.jpeg public/img/news/*.png public/img/news/*.webp)
          if [ ${#files[@]} -eq 0 ]; then exit 0; fi
          command -v convert >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick; }
          for f in "${files[@]}"; do
            ext=$(printf %s "${f##*.}" | tr A-Z a-z)
            if [ "$ext" = jpg ] || [ "$ext" = jpeg ]; then out="$f"; else out="$f.jpg"; fi
            convert "$f" -auto-orient -strip -background '#16171A' -flatten -resize '1800x1800>' -quality 82 "$out.tmp.jpg" && mv "$out.tmp.jpg" "$out"
          done
          ls -la public/img/news

      - name: Inhalte aufbereiten
        run: node scripts/build-content.mjs

      - name: Auf Cloudflare Pages veröffentlichen
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: a85652029c4e35a2fc75172ec88c3b9d
          command: pages deploy public --project-name=ffd-production-website --branch=main --commit-dirty=true
